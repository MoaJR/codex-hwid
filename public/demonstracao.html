function home(){app.innerHTML=`<div class="demo"><span>Versão demonstrativa · conteúdo e dados ilustrativos</span><button onclick="go('/medico')">Conhecer a plataforma →</button></div><header><a href="#/">${brand()}</a><nav><a href="#/sobre">Sobre</a><a href="#/tratamentos">Tratamentos</a><a href="#/como-funciona">Como funciona</a><a href="#/agendar">Consultas</a><a href="#/faq">Dúvidas</a><button onclick="go('/paciente')">${icon('user')} Área do paciente</button></nav></header><main><section class="hero"><div class="hero-copy"><span class="eyebrow">Escuta que acolhe. Cuidado que acompanha.</span><h1>Cuidar da saúde<br>mental é cuidar<br>da sua <em>vida.</em></h1><p>Um olhar atento para a sua história. Um cuidado individualizado para construir mais equilíbrio e bem-estar, no seu tempo.</p><div class="actions"><button class="primary" onclick="go('/agendar')">Agendar uma consulta &nbsp; ↗</button><button onclick="go('/consulta-online')">Consulta online &nbsp; ${icon('video')}</button></div><div class="micro"><span></span> Atendimento humanizado e baseado em evidências</div></div><div class="hero-art"><svg class="botanical" viewBox="0 0 400 500" fill="none" aria-hidden="true"><ellipse cx="210" cy="470" rx="115" ry="15" fill="#b5c2ad"/><path d="M203 470C195 340 190 200 250 55M202 390C155 325 120 270 75 230M202 305C245 260 285 220 320 170" stroke="#627d61" stroke-width="3"/><g fill="#8fa88a"><path d="M221 208C150 182 159 111 189 84c35 40 53 80 32 124Z"/><path d="M229 157c6-64 38-91 82-90-4 42-33 80-82 90Z"/><path d="M200 300c-62-10-85-61-77-102 42 11 78 45 77 102Z"/><path d="M208 340c18-63 68-86 110-75-17 43-53 77-110 75Z"/><path d="M141 325c-64 10-99-27-108-65 45-6 84 9 108 65Z"/><path d="M265 237c-4-50 16-88 55-104 14 44-6 87-55 104Z"/><path d="M204 431c-42-17-65-54-58-91 38 13 62 49 58 91Z"/><path d="M201 414c21-48 54-61 91-47-19 32-49 49-91 47Z"/></g><g stroke="#688463" opacity=".6"><path d="m183 119 36 82m19-52 59-65m-94 242 95-48m-154 38-93-43"/></g></svg><div class="art-note">${icon('heart')}<div><span class="serif">Cada história merece cuidado.</span><p>Psiquiatria com acolhimento e respeito à sua individualidade.</p></div></div></div></section><div class="benefits">${[['user','Escuta e acolhimento'],['heart','Cuidado individualizado'],['shield','Sigilo e privacidade'],['leaf','Acompanhamento contínuo']].map(([i,t])=>`<div>${icon(i)}${t}</div>`).join('')}</div><section class="section" id="tratamentos"><div class="section-head"><div><span class="eyebrow">Um cuidado para cada momento</span><h2>Como posso ajudar você?</h2></div><p>Compreender o que acontece é o primeiro passo para encontrar um caminho de cuidado.</p></div><div class="treatments">${treatments.map(([i,t,d])=>`<button class="treatment" onclick="treatment('${t}')">${icon(i)}<h3>${t}</h3><p>${d}</p><span class="arrow">↗</span></button>`).join('')}</div></section><section class="section about" id="sobre"><div class="about-visual"><div><span class="eyebrow">Espaço reservado ao retrato profissional</span><span class="serif">Douglas Vaz</span><p>Foto e registros profissionais a confirmar</p></div></div><div><span class="eyebrow">Sobre o médico</span><h2>Prazer, Dr. Douglas Vaz.</h2><p>A proposta deste espaço é aproximar você de um cuidado em saúde mental que valoriza a escuta, o vínculo e a sua história.</p><p>O acompanhamento considera as necessidades de cada pessoa, com decisões compartilhadas e informação clara em todas as etapas.</p><button onclick="modal('Informações profissionais','<p>A biografia, a formação, o CRM e o RQE do Dr. Douglas Vaz serão incluídos após confirmação.</p>')">Conheça o médico &nbsp; ↗</button></div></section><section class="section" id="como-funciona"><span class="eyebrow">Do primeiro contato ao acompanhamento</span><h2>Você não precisa dar esse passo sozinho.</h2><div class="steps">${[['01','Escolha seu atendimento','Veja as modalidades e escolha a que faz sentido para você.'],['02','Um espaço para ouvir você','Na primeira consulta, sua história é o ponto de partida.'],['03','Seguimos juntos','Um plano de cuidado individualizado, com acompanhamento contínuo.']].map(([n,t,p])=>`<div class="step"><b>${n}</b><h3>${t}</h3><p>${p}</p></div>`).join('')}</div></section><section class="cta"><div><span class="eyebrow" style="color:#bdd2c4">O próximo passo pode ser hoje</span><h2>Reserve um tempo para cuidar de você.</h2><p>Conheça as opções de atendimento e inicie seu caminho.</p></div><button onclick="go('/agendar')">Agendar consulta &nbsp; ↗</button></section><section class="faq" id="faq"><span class="eyebrow">Perguntas frequentes</span><h2>Vamos esclarecer suas dúvidas.</h2>${[['Como funciona a primeira consulta?','É um momento para conversar sobre sua história, suas necessidades e expectativas. A partir dessa avaliação, o médico discute as possibilidades de cuidado.'],['É possível fazer a consulta online?','A modalidade online está prevista na plataforma. A disponibilidade e os requisitos serão confirmados pela equipe antes do atendimento.'],['Preciso usar medicação?','A indicação depende da avaliação individual. As decisões são discutidas com o médico, que explica benefícios, riscos e alternativas.']].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</section></main><footer>${brand()}<span>© 2026 Dr. Douglas Vaz · Demonstração</span><a href="#/privacidade">Privacidade e segurança</a></footer>`}
function treatment(t){modal(t,`<p>A avaliação psiquiátrica busca compreender sintomas, contexto de vida e necessidades individuais. O acompanhamento pode envolver orientações, psicoterapia e medicação, quando indicada.</p><p style="margin:18px 0">Este conteúdo é educativo e não estabelece diagnóstico.</p><button class="primary" onclick="document.querySelector('#modal').close();go('/agendar')">Conhecer os atendimentos</button>`)}
const patientNav=[['grid','Visão geral',''],['calendar','Minha agenda','agenda'],['doc','Consultas','consultas'],['smile','Diário de humor','diario'],['pill','Medicações','medicacoes'],['grid','Escalas','escalas'],['doc','Documentos','documentos'],['message','Mensagens','mensagens'],['settings','Meu perfil','perfil']];const doctorNav=[['grid','Visão geral',''],['calendar','Agenda','agenda'],['user','Pacientes','pacientes'],['doc','Prontuários','prontuarios'],['doc','Documentos','documentos'],['message','Mensagens','mensagens']];const adminNav=[['grid','Visão geral',''],['user','Usuários','usuarios'],['calendar','Agenda','agenda'],['doc','Financeiro','financeiro'],['doc','Conteúdo','conteudo'],['shield','Auditoria','auditoria'],['settings','Configurações','configuracoes']];
function shell(role,sub){const nav=role==='paciente'?patientNav:role==='medico'?doctorNav:adminNav;app.innerHTML=`<div class="shell"><aside class="sidebar">${brand()}${nav.map(([i,t,s])=>`<button class="${sub===s?'active':''}" onclick="go('/${role}${s?'/'+s:''}')">${icon(i)}${t}</button>`).join('')}<div class="bottom"><button onclick="go('/')">← Voltar ao site</button><button onclick="go('/${role==='paciente'?'medico':role==='medico'?'admin':'paciente'}')">Alternar ambiente ↗</button></div></aside><div class="workspace"><div class="topbar"><span>${role==='paciente'?'Meu espaço de cuidado':role==='medico'?'Consultório · Dr. Douglas Vaz':'Gestão do consultório'}</span><div class="mode-nav"><button onclick="go('/')">Site</button><button onclick="go('/paciente')">Paciente</button><button onclick="go('/medico')">Médico</button><button onclick="go('/admin')">Admin</button></div><span><span class="avatar">${role==='paciente'?'MS':'DV'}</span>${role==='paciente'?'Mariana S.':'Douglas Vaz'}</span></div><main class="content"><div class="notice">Ambiente demonstrativo · todos os dados são fictícios. Não insira informações reais de saúde.</div><div id="view"></div></main></div></div>`;if(role==='paciente')patient(sub);else professional(role,sub)}
function chart(){return `<svg class="chart" viewBox="0 0 600 200" role="img" aria-label="Gráfico ilustrativo de humor: tendência de 4 para 8, sem interpretação clínica"><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#80af92" stop-opacity=".25"/><stop offset="1" stop-color="#80af92" stop-opacity="0"/></linearGradient></defs>${[30,70,110,150,190].map(y=>`<path d="M25 ${y}H580" stroke="#eef0ec"/>`).join('')}<path d="M30 142 90 110 150 120 210 70 270 100 330 60 390 75 450 40 510 65 575 22V190H30Z" fill="url(#fade)"/><path d="M30 142 90 110 150 120 210 70 270 100 330 60 390 75 450 40 510 65 575 22" fill="none" stroke="#4d9279" stroke-width="2"/>${[[30,142],[90,110],[150,120],[210,70],[270,100],[330,60],[390,75],[450,40],[510,65],[575,22]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" fill="#528e73" stroke="white"/>`).join('')}</svg><div class="chart-labels">${['Maio','Junho','Julho','Agosto','Setembro','Outubro'].map(t=>`<span>${t}</span>`).join('')}</div>`}
function heading(t,d){return `<div class="welcome"><div><h1>${t}</h1><p>${d}</p></div><span class="pill">● &nbsp; Seu cuidado, mais perto</span></div>`}
function dashboard(){return `${heading('Olá, Mariana ☀','Que bom ter você por aqui. Como você está hoje?')}<div class="grid4"><div class="card"><div class="card-top"><h3>Próxima consulta</h3>${icon('calendar')}</div><div class="datebox"><div><b>27</b><small>OUT</small></div><div><p>Terça-feira · 14:00</p><p>Consulta online</p></div></div><button onclick="appointment()">Ver detalhes →</button></div><div class="card"><div class="card-top"><h3>Diário de humor</h3>${icon('smile')}</div><div class="smile">☺</div><p style="text-align:center">Um momento para olhar para você.</p><button onclick="go('/paciente/diario')">Registrar meu humor</button></div><div class="card"><div class="card-top"><h3>Medicações</h3>${icon('pill')}</div><div class="ring">${taken.size}/2</div><p style="text-align:center">Registros ilustrativos de hoje</p><button onclick="go('/paciente/medicacoes')">Ver medicações</button></div><div class="card"><div class="card-top"><h3>Escalas pendentes</h3>${icon('grid')}</div><span class="big" style="text-align:center">02</span><p style="text-align:center">Para conversar na próxima consulta</p><button onclick="go('/paciente/escalas')">Ver escalas →</button></div></div><div class="two-col"><div><div class="card"><h3>Seu acompanhamento em um olhar</h3><div class="stats">${[['Consultas realizadas','12'],['Documentos','08'],['Registros de humor','24'],['Meses de cuidado','06']].map(([t,n])=>`<div><p>${t}</p><b>${n}</b></div>`).join('')}</div></div><div class="card" style="margin-top:20px"><div class="subhead"><h3>Evolução do seu humor</h3><span class="pill">Últimos 6 meses · exemplo</span></div>${chart()}<p style="margin-top:18px">Cada dia faz parte da sua história. Leve suas percepções para a consulta.</p></div></div><div class="card"><h3>Avisos e atividades</h3>${[['calendar','Sua consulta está chegando','27 de outubro, às 14h. Separe um lugar tranquilo.'],['doc','Escalas disponíveis','Você tem 2 instrumentos para revisar com o médico.'],['smile','Seu último registro','Ontem · Humor registrado: 8/10'],['shield','Um espaço seguro','Seus dados devem ser acessíveis apenas à equipe autorizada.']].map(([i,t,d])=>`<div class="activity"><span class="dot">${icon(i)}</span><div><small>${t}</small>${d}</div></div>`).join('')}<p style="margin-top:30px">Este canal não oferece atendimento de emergência.</p></div></div>`}
let taken=new Set(),mood=8,entries=[];
function patient(sub){const v=document.querySelector('#view');if(!sub){v.innerHTML=dashboard();return}if(sub==='diario'){v.innerHTML=heading('Um momento para você','Perceber como você se sente também é uma forma de cuidado.')+`<div class="card form-card"><h2 style="font-size:30px">Como você está hoje?</h2><p>Selecione a expressão mais próxima do seu dia.</p><div class="moods">${['😔','🙁','😐','🙂','😊'].map((e,i)=>`<button aria-label="Humor ${i*2+2} de 10" class="${mood===i*2+2?'selected':''}" onclick="mood=${i*2+2};patient('diario')">${e}</button>`).join('')}</div><label for="mood-range">Seu humor: <b id="mood-value">${mood}/10</b></label><input id="mood-range" type="range" min="1" max="10" value="${mood}" oninput="mood=+this.value;document.querySelector('#mood-value').textContent=mood+'/10'"><label for="sleep">Como foi seu sono?</label><select id="sleep"><option>Selecione</option><option>Reparador</option><option>Regular</option><option>Difícil</option></select><label for="notes">Quer acrescentar algo? (opcional)</label><textarea id="notes" placeholder="Use somente informações fictícias nesta demonstração."></textarea><button class="primary" onclick="saveMood()">Salvar registro demonstrativo</button></div><div class="card form-card" style="margin-top:20px"><h3>Registros desta sessão</h3>${entries.length?entries.map(e=>`<div class="row"><span>${e.time}</span><b>${e.mood}/10</b></div>`).join(''):'<p>Seus registros desta demonstração aparecerão aqui.</p>'}</div>`;return}if(sub==='medicacoes'){v.innerHTML=heading('Suas medicações','Organize seus registros conforme a orientação do seu médico.')+`<div class="notice">Exemplos fictícios, sem indicação de tratamento. Não altere sua medicação por conta própria.</div><div class="card form-card">${['Medicação de exemplo A · Manhã','Medicação de exemplo B · Noite'].map((t,i)=>`<div class="row"><div><h3>${t}</h3><p>Orientação definida pelo profissional</p></div><button class="${taken.has(i)?'primary':''}" onclick="if(taken.has(${i})){taken.delete(${i})}else{taken.add(${i})}patient('medicacoes');toast('Registro demonstrativo atualizado')">${taken.has(i)?'✓ Registrada':'Registrar tomada'}</button></div>`).join('')}</div>`;return}if(sub==='agenda'||sub==='consultas'){v.innerHTML=heading(sub==='agenda'?'Minha agenda':'Minhas consultas','Encontre os detalhes dos seus atendimentos.')+`<div class="card"><div class="row"><div><span class="pill">Agendada · exemplo</span><h3 style="margin-top:20px">27 de outubro de 2026 · 14:00</h3><p>Dr. Douglas Vaz · Consulta online</p></div><button onclick="appointment()">Ver detalhes</button></div><button onclick="go('/agendar')">Simular novo agendamento</button></div>`;return}if(sub==='escalas'){v.innerHTML=heading('Escalas de acompanhamento','Instrumentos que ajudam na conversa com seu médico.')+`<div class="card">${['Ansiedade · GAD-7','Humor · PHQ-9'].map(t=>`<div class="row"><div><h3>${t}</h3><p>Instrumento previsto · aplicação ainda não habilitada</p></div><button onclick="modal('Escala em preparação','<p>A aplicação depende da validação do instrumento, de sua versão e do fluxo clínico. Não há avaliação ou pontuação nesta demonstração.</p>')">Ver informações</button></div>`).join('')}</div>`;return}if(sub==='documentos'){v.innerHTML=heading('Meus documentos','Receitas, relatórios e documentos compartilhados pela equipe.')+`<div class="card empty">${icon('doc')}<h2 style="margin-top:20px">Nenhum documento disponível</h2><p>Quando a equipe disponibilizar um documento, ele aparecerá aqui.</p></div>`;return}if(sub==='mensagens'){v.innerHTML=heading('Mensagens','Um canal para organizar sua comunicação com a equipe.')+`<div class="card form-card"><p>Este canal não é monitorado para emergências. Em risco imediato, procure um serviço de urgência.</p><label for="message">Mensagem demonstrativa</label><textarea id="message" placeholder="Escreva uma mensagem fictícia"></textarea><button class="primary" onclick="if(document.querySelector('#message').value.trim()){document.querySelector('#message').value='';toast('Simulação concluída. Nenhuma mensagem foi enviada.')}else toast('Escreva uma mensagem para simular')">Simular envio</button></div>`;return}v.innerHTML=heading('Meu perfil','Dados fictícios utilizados na demonstração.')+`<div class="card form-card"><h3>Mariana Santos</h3><p>Perfil de exemplo · nenhum cadastro real foi criado.</p><button onclick="go('/')">Voltar ao site</button></div>`}
function saveMood(){entries.unshift({mood,time:new Date().toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})});patient('diario');toast('Registro salvo apenas nesta sessão demonstrativa.')}
function appointment(){modal('Sua próxima consulta',`<p><b>27 de outubro de 2026 · 14:00</b><br>Dr. Douglas Vaz · Modalidade online<br>Duração ilustrativa: 50 minutos.</p><p style="margin-top:20px">A chamada de vídeo e os lembretes serão habilitados após integração. Este agendamento é fictício.</p><button style="margin-top:20px" onclick="document.querySelector('#modal').close();go('/agendar')">Simular reagendamento</button>`)}
const people=['Mariana Santos','João Silva','Carlos Eduardo','Fernanda Lima','Pedro Henrique'];
function professional(role,sub){const v=document.querySelector('#view');if(role==='admin'){v.innerHTML=heading(sub?({usuarios:'Usuários',agenda:'Agenda',financeiro:'Financeiro',conteudo:'Conteúdo',auditoria:'Auditoria',configuracoes:'Configurações'}[sub]):'Visão geral do consultório','Ambiente de gestão · demonstração sem dados reais.')+`<div class="grid4">${[['Pacientes','24'],['Consultas no mês','38'],['Confirmações pendentes','05'],['Integrações ativas','00']].map(([t,n])=>`<div class="card"><h3>${t}</h3><span class="big">${n}</span><p>Dados ilustrativos</p></div>`).join('')}</div><div class="card" style="margin-top:24px"><h3>${sub==='conteudo'?'Conteúdo a confirmar':'Preparação do ambiente'}</h3><p>${sub==='conteudo'?'Biografia, foto profissional, CRM/RQE, modalidades, valores e contato aguardam confirmação.':'Autenticação, permissões, auditoria e integrações precisam ser configuradas no servidor antes de uso operacional.'}</p><button onclick="modal('Próximas configurações','<p>Esta versão não gerencia usuários, pagamentos ou dados clínicos reais. Os módulos foram documentados para implementação gradual com autorização no servidor.</p>')">Ver detalhes</button></div>`;return}if(sub==='pacientes'||sub==='prontuarios'){v.innerHTML=heading(sub==='pacientes'?'Pacientes':'Prontuários','Dados de exemplo para explorar a organização do consultório.')+`<input class="search" type="search" aria-label="Buscar paciente" placeholder="Buscar paciente..." oninput="filterPeople(this.value)"><div class="card" id="patients">${patientTable(people)}</div>`;return}if(sub==='documentos'||sub==='mensagens'){v.innerHTML=heading(sub==='documentos'?'Documentos clínicos':'Mensagens','Organização do atendimento')+`<div class="card empty"><h2>Nenhuma pendência disponível</h2><p>Este módulo está preparado visualmente para a próxima etapa de implementação.</p></div>`;return}v.innerHTML=heading(sub==='agenda'?'Agenda':'Bom dia, Dr. Douglas','Sexta-feira, 23 de outubro de 2026 · Uma visão do seu dia.')+`<div class="grid4">${[['Consultas hoje','05'],['Pacientes em acompanhamento','24'],['Solicitações pendentes','03'],['Escalas para revisar','02']].map(([t,n])=>`<div class="card"><h3>${t}</h3><span class="big">${n}</span><p>Exemplo de acompanhamento</p></div>`).join('')}</div><div class="two-col"><div class="card"><div class="subhead"><h3>Agenda do dia</h3><span class="pill">23 OUT · exemplo</span></div>${people.map((n,i)=>`<div class="row"><div style="display:flex;gap:20px;align-items:center"><span style="color:#7c8a7e">${9+i}:00</span><div><h3>${n}</h3><p>${i%2?'Retorno · Presencial':'Consulta online'}</p></div></div><button onclick="record('${n}')">Abrir prontuário</button></div>`).join('')}</div><div class="card"><h3>Acompanhamento do consultório</h3>${chart()}<p>Volume ilustrativo de registros mensais.</p><div class="activity">${icon('shield')}<p>O acesso clínico real exige autenticação, vínculo assistencial e auditoria no servidor.</p></div></div></div>`}
function patientTable(list){return list.length?`<table class="table"><thead><tr><th>Paciente</th><th>Acompanhamento</th><th></th></tr></thead><tbody>${list.map(n=>`<tr><td>${n}</td><td>Ativo · fictício</td><td><button onclick="record('${n}')">Abrir prontuário</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty"><p>Nenhum paciente encontrado.</p></div>'}
function filterPeople(q){document.querySelector('#patients').innerHTML=patientTable(people.filter(n=>n.toLowerCase().includes(q.toLowerCase())))}
function record(n){modal('Prontuário demonstrativo',`<h3>${n}</h3><p style="margin-top:15px">Paciente fictício · dados clínicos não preenchidos.</p><div style="border-top:1px solid var(--line);margin:20px 0;padding-top:20px"><h3>Resumo do acompanhamento</h3><p>Primeira avaliação, evolução, documentos e timeline serão organizados neste ambiente.</p></div><label for="draft">Rascunho ilustrativo (não será salvo)</label><textarea id="draft" placeholder="Não insira dados clínicos reais."></textarea><p style="font-size:11px">Finalização e edição de prontuários dependem de autenticação e auditoria no servidor.</p>`)}
function booking(){home();modal('Agende seu primeiro passo',`<p>Explore o fluxo de agendamento. Nenhuma reserva real será feita.</p><form id="booking"><label for="kind">Tipo de atendimento</label><select id="kind" required style="width:100%"><option value="">Selecione</option><option>Primeira consulta</option><option>Retorno</option><option>Consulta online</option></select><label for="day">Data de exemplo</label><input id="day" type="date" min="2026-10-24" required><label for="time">Horário ilustrativo</label><select id="time" style="width:100%"><option>09:00</option><option>11:00</option><option>14:00</option><option>16:00</option></select><p style="font-size:11px;margin-top:20px">Disponibilidade, valores e identificação serão integrados na etapa de agendamento.</p><button class="primary" style="margin-top:20px;width:100%">Simular agendamento →</button></form>`);document.querySelector('#booking').onsubmit=e=>{e.preventDefault();const d=document.querySelector('#day').value,t=document.querySelector('#time').value,k=document.querySelector('#kind').value;modal('Simulação concluída',`<span class="pill">✓ Fluxo demonstrativo</span><p style="margin-top:20px">${k}<br>${d.split('-').reverse().join('/')} às ${t}</p><p style="margin-top:15px">Nenhuma consulta foi reservada ou pagamento realizado. A confirmação real dependerá da equipe e da disponibilidade integrada.</p><button style="margin-top:20px" onclick="document.querySelector('#modal').close();go('/paciente')">Conhecer a área do paciente →</button>`)}}
function render(){document.querySelector('#modal').close();const r=(location.hash.slice(1)||'/').split('/').filter(Boolean);if(['paciente','medico','admin'].includes(r[0]))shell(r[0],r[1]||'');else if(r[0]==='agendar')booking();else{home();if(['sobre','tratamentos','como-funciona','faq'].includes(r[0]))setTimeout(()=>document.getElementById(r[0])?.scrollIntoView({behavior:'smooth'}),30);if(r[0]==='consulta-online')modal('Consulta online','<p>O atendimento por vídeo permite conversar com o médico em um ambiente reservado. Você precisará de conexão estável, câmera, áudio e um local tranquilo.</p><button class="primary" style="margin-top:20px" onclick="document.querySelector(\'#modal\').close();go(\'/agendar\')">Explorar agendamento</button>');if(r[0]==='privacidade')modal('Privacidade e segurança','<p>Esta demonstração não solicita cadastro nem envia dados de saúde a um servidor. Os registros ilustrativos ficam somente na memória da sessão e desaparecem ao recarregar a página.</p><p style="margin-top:16px">O sistema definitivo requer autenticação, autorização no servidor, auditoria, política de retenção e infraestrutura validada antes de receber dados reais.</p>')}window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
</script></body></html>
